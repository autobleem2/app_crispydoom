[app]
Title=Doom (Shareware)
Author=Crispy Doom by Fabian Greffrath and contributors; Doom by id Software, 1993
Version=7.1-1
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/crispy-doom on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances, bin/win/crispy-doom.exe on Windows
Exec=bin/{key}/crispy-doom
# the launcher starts an App in its own folder: the game, both settings files and the saves are all here
Args=-iwad DOOM1.WAD -config default.cfg -extraconfig crispy-doom.cfg -savedir savegames
# SDL2_net, built with the program; SDL2 and SDL2_mixer are the launcher's (the console, Windows) or the system's
Lib=lib/{key}
# Crispy Doom reads the pad through SDL's GameController API; the virtual pad shows it an Xbox 360 pad, and
# crispy-doom.cfg lays that out as the 2020 PlayStation Classic port did
VirtualPad=true
Kernel=false
